    <script>
        const supabaseUrl = 'https://ovaekdszrtrqyfxubjzw.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92YWVrZHN6cnRycXlmeHVianp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNDk1MjAsImV4cCI6MjA5OTcyNTUyMH0.UBbE3tgpaVLHWoZX7h30KlrLSOVHTheZw7xvMLOrD_E';
        
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        const simpedikClient = supabaseClient;
        let schoolData = {};

        async function loadSchoolIdentity() {
            try {
                const { data, error } = await simpedikClient
                    .from('identitassekolah')
                    .select('nama_sekolah, logo, kop_sekolah')
                    .limit(1)
                    .maybeSingle();
                
                if (data) {
                    schoolData = data;
                    if (data.nama_sekolah) {
                        document.querySelector('.navbar-brand span').textContent = data.nama_sekolah;
                    }
                    if (data.logo) {
                        const img = document.querySelector('.navbar-brand img');
                        img.src = data.logo;
                        img.style.display = 'block';
                    }
                }
            } catch (err) {
                console.log("Info: Gagal memuat identitas sekolah (mungkin tabel belum ada).");
            }
        }
        document.addEventListener('DOMContentLoaded', loadSchoolIdentity);

        let activeKelas = '';
        let mappingIndex = {};
        let kelasList = [];

        async function loadKelasTabs() {
            const tabsHeader = document.getElementById('tabsHeader');
            const tabsContent = document.getElementById('tabsContent');
            
            if (!tabsHeader || !tabsContent || !supabaseClient) return;

            let mappingData = [];
            let waliData = [];

            const resMapping = await supabaseClient
                .from('mappingsiswa')
                .select('kelas');
            if (resMapping.data) mappingData = resMapping.data;

            const resWali = await simpedikClient
                .from('walikelas')
                .select('kelas');
            if (resWali.data) waliData = resWali.data;

            try {
                tabsHeader.innerHTML = '';
                tabsContent.innerHTML = '';

                let allClasses = [];
                if (mappingData.length > 0) allClasses = allClasses.concat(mappingData.map(item => item.kelas));
                if (waliData.length > 0) allClasses = allClasses.concat(waliData.map(item => item.kelas));

                const uniqueKelas = [...new Set(allClasses)].filter(k => k && k.trim() !== '').sort();
                const prevKelas = activeKelas;
                kelasList = uniqueKelas;
                const activeIndex = Math.max(0, uniqueKelas.indexOf(prevKelas));
                activeKelas = uniqueKelas[activeIndex] || '';

                if (uniqueKelas.length === 0) {
                    tabsHeader.innerHTML = '<div style="padding:10px; color:var(--muted);">Belum ada data kelas.</div>';
                    tabsContent.innerHTML = '<div class="empty-note">Silakan tambah data mapping siswa pertama Anda dengan menekan tombol Tambah Mapping di bawah.</div>';
                    return;
                }

                uniqueKelas.forEach((kelasName, index) => {
                    const btn = document.createElement('button');
                    btn.className = `tab-btn ${index === activeIndex ? 'active' : ''}`;
                    btn.textContent = kelasName;
                    btn.onclick = () => switchTab(index);
                    tabsHeader.appendChild(btn);

                    const pane = document.createElement('div');
                    pane.className = `tab-pane ${index === activeIndex ? 'active' : ''}`;
                    pane.id = `pane-${index}`;
                    
                    const tableDiv = document.createElement('div');
                    const tbodyId = `tbody-${kelasName.replace(/\s+/g, '-')}`;
                    tableDiv.className = 'table-responsive';
                    tableDiv.innerHTML = `
                        <table class="custom-table wide">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Kode Mapping</th>
                                    <th>Kelas</th>
                                    <th>NISN</th>
                                    <th>Nama Siswa</th>
                                    <th>Alamat</th>
                                    <th>Tempat Lahir</th>
                                    <th>Tanggal Lahir</th>
                                    <th>Nama Ayah</th>
                                    <th>Nama Ibu</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="${tbodyId}"><tr><td colspan="11" style="text-align:center; padding:20px; color:#6b7280;">Memuat data...</td></tr></tbody>
                        </table>
                    `;
                    pane.appendChild(tableDiv);

                    tabsContent.appendChild(pane);

                    loadMappingDataForClass(kelasName);
                });

            } catch (err) {
                console.error('Error loading tabs:', err);
                tabsHeader.innerHTML = `<div style="color:red; padding:10px;">Gagal memuat data: ${err.message}</div>`;
            }
        }

        async function loadMappingDataForClass(kelas) {
            const tbodyId = `tbody-${kelas.replace(/\s+/g, '-')}`;
            const tbody = document.getElementById(tbodyId);
            if (!tbody) return;

            try {
                const { data, error } = await supabaseClient
                    .from('mappingsiswa')
                    .select('*')
                    .eq('kelas', kelas)
                    .order('nama_siswa', { ascending: true });

                if (error) throw error;

                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:20px; color:#6b7280;">Belum ada data mapping untuk kelas ini.</td></tr>';
                    return;
                }

                data.forEach((item, index) => {
                    mappingIndex[item.kode_maping] = item;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item.kode_maping}</td>
                        <td>${item.kelas}</td>
                        <td>${item.nisn || '-'}</td>
                        <td>${item.nama_siswa}</td>
                        <td>${item.alamat || '-'}</td>
                        <td>${item.tempat_lahir || '-'}</td>
                        <td>${item.tanggal_lahir || '-'}</td>
                        <td>${item.nama_ayah || '-'}</td>
                        <td>${item.nama_ibu || '-'}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-action btn-edit" data-kode="${escHtml(item.kode_maping)}" title="Edit Kelas"><i class="fas fa-edit"></i></button>
                                <button class="btn-action btn-delete" onclick="deleteMapping('${item.kode_maping}', '${item.kelas}')" title="Hapus Mapping"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error(`Error loading data for ${kelas}:`, err);
                tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; color:red;">Gagal memuat data: ${err.message}</td></tr>`;
            }
        }

        function switchTab(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
            document.querySelectorAll('.tab-pane').forEach((pane, i) => pane.classList.toggle('active', i === index));
            activeKelas = kelasList[index] || '';
        }

        document.addEventListener('DOMContentLoaded', loadKelasTabs);

        // --- Tombol menu di footer (dock) ---
        document.getElementById('addMappingBtn').addEventListener('click', () => openMappingModal(activeKelas));
        document.getElementById('exportPdfBtn').addEventListener('click', () => {
            if (!activeKelas) { alert('Belum ada data kelas untuk diexport.'); return; }
            exportMappingPdf(activeKelas);
        });

        const modal = document.getElementById('mappingModal');
        const closeSpan = document.querySelector('.close-modal');
        const cancelBtn = document.querySelector('.cancel-btn');
        const mappingForm = document.getElementById('mappingForm');
        
        const namaSiswaSearch = document.getElementById('namaSiswaSearch');
        const namaSiswaHidden = document.getElementById('namaSiswa');
        const siswaDropdown = document.getElementById('siswaDropdown');
        
        let rombelCache = [];
        let siswaCache = [];

        window.openMappingModal = async function(kelasName) {
            mappingForm.reset();
            clearSelection();
            const kelasInput = document.getElementById('kelasMapping');
            
            // Load Data Rombel untuk Dropdown dari Project SIMPedik
            if (rombelCache.length === 0) {
                try {
                    const { data, error } = await simpedikClient
                        .from('rombel')
                        .select('nama_kelas')
                        .order('nama_kelas');
                    if (!error) rombelCache = data;
                } catch (err) {
                    console.error('Error loading rombel:', err);
                }
            }

            // Populate Dropdown
            kelasInput.innerHTML = '<option value="">Pilih Kelas</option>';
            if (rombelCache.length > 0) {
                rombelCache.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.nama_kelas;
                    opt.textContent = r.nama_kelas;
                    kelasInput.appendChild(opt);
                });
            }

            if (kelasName) {
                kelasInput.value = kelasName;
            }
            
            if (siswaCache.length === 0) {
                try {
                    const { data, error } = await simpedikClient
                        .from('datasiswa')
                        .select('*')
                        .order('nama_siswa');
                    if (!error) siswaCache = dedupeSiswa(data);
                } catch (err) {
                    console.error('Error loading siswa:', err);
                }
            }

            // Selalu muat ulang daftar siswa yang sudah dimapping (semua kelas)
            try { await refreshMapped(); } catch (err) { console.error('Error loading mapping:', err); }
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            siswaDropdown.classList.remove('show');
        }

        closeSpan.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);
        window.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        namaSiswaSearch.addEventListener('input', function() {
            if (selectedSiswa && this.value !== selectedSiswa.nama_siswa) clearSelection(true);
            const filter = this.value.toLowerCase();
            const filtered = siswaCache.filter(s => s.nama_siswa.toLowerCase().includes(filter));
            renderDropdown(filtered);
        });

        namaSiswaSearch.addEventListener('focus', function() {
            const filter = this.value.toLowerCase();
            const filtered = filter ? siswaCache.filter(s => s.nama_siswa.toLowerCase().includes(filter)) : siswaCache;
            renderDropdown(filtered);
        });

        function renderDropdown(data) {
            siswaDropdown.innerHTML = '';
            if (data.length === 0) {
                siswaDropdown.innerHTML = '<div class="no-results">Tidak ditemukan</div>';
            } else {
                data.forEach(siswa => {
                    const div = document.createElement('div');
                    const used = mappedByKey[siswaKey(siswa.nisn, siswa.nama_siswa)];
                    div.className = 'dropdown-option' + (used ? ' disabled' : '');
                    if (used) {
                        div.textContent = `${siswa.nama_siswa} — sudah dimapping di kelas ${used.kelas}`;
                        div.title = 'Siswa ini sudah dimapping, tidak bisa ditambahkan lagi';
                    } else {
                        div.textContent = siswa.nama_siswa;
                        div.onclick = () => selectSiswa(siswa);
                    }
                    siswaDropdown.appendChild(div);
                });
            }
            siswaDropdown.classList.add('show');
        }

        function selectSiswa(siswa) {
            namaSiswaSearch.value = siswa.nama_siswa;
            namaSiswaHidden.value = siswa.nama_siswa;
            
            document.getElementById('nisn').value = siswa.nisn || '';
            document.getElementById('alamat').value = siswa.alamat || '';
            document.getElementById('tempatLahir').value = siswa.tempat_lahir || '';
            document.getElementById('tanggalLahir').value = siswa.tanggal_lahir || '';
            document.getElementById('namaAyah').value = siswa.nama_ayah || '';
            document.getElementById('namaIbu').value = siswa.nama_ibu || '';
            
            selectedSiswa = siswa;
            updateKode();
            
            siswaDropdown.classList.remove('show');
        }

        // Kode mapping selalu mengikuti kelas + siswa yang dipilih (tidak bisa diketik manual)
        document.getElementById('kelasMapping').addEventListener('change', updateKode);

        document.addEventListener('click', function(e) {
            if (!namaSiswaSearch.contains(e.target) && !siswaDropdown.contains(e.target)) {
                siswaDropdown.classList.remove('show');
            }
        });

        // --- Anti data ganda: satu siswa hanya boleh dimapping SEKALI (di kelas mana pun) ---
        let selectedSiswa = null;
        let mappedByKey = {};
        let mappedByKode = {};

        const normNama = t => String(t == null ? '' : t).trim().replace(/\s+/g, ' ').toLowerCase();
        // Kunci identitas siswa: NISN; jika NISN kosong pakai nama (tanpa beda huruf besar/spasi)
        function siswaKey(nisn, nama) {
            const n = String(nisn == null ? '' : nisn).trim();
            return n ? 'n:' + n : 'a:' + normNama(nama);
        }

        function dedupeSiswa(list) {
            const seen = new Set();
            return (list || []).filter(s => {
                const k = siswaKey(s.nisn, s.nama_siswa);
                if (seen.has(k)) return false;
                seen.add(k);
                return true;
            });
        }

        async function refreshMapped() {
            const byKey = {}, byKode = {};
            const size = 1000;
            for (let from = 0; ; from += size) {
                const { data, error } = await supabaseClient
                    .from('mappingsiswa')
                    .select('kode_maping, kelas, nama_siswa, nisn')
                    .order('kode_maping')
                    .range(from, from + size - 1);
                if (error) throw error;
                (data || []).forEach(r => {
                    const k = siswaKey(r.nisn, r.nama_siswa);
                    if (!byKey[k]) byKey[k] = r;
                    byKode[r.kode_maping] = r;
                });
                if (!data || data.length < size) break;
            }
            mappedByKey = byKey;
            mappedByKode = byKode;
        }

        function updateKode() {
            const kodeEl = document.getElementById('kodeMapping');
            const kelasVal = document.getElementById('kelasMapping').value;
            if (!selectedSiswa || !kelasVal) { kodeEl.value = ''; return; }
            const nisnVal = String(selectedSiswa.nisn || '').trim();
            const idPart = nisnVal || normNama(selectedSiswa.nama_siswa).replace(/\s+/g, '').toUpperCase();
            kodeEl.value = `ID.${kelasVal}-${idPart}`;
        }

        function clearSelection(keepSearchText) {
            selectedSiswa = null;
            namaSiswaHidden.value = '';
            if (!keepSearchText) namaSiswaSearch.value = '';
            ['nisn', 'alamat', 'tempatLahir', 'tanggalLahir', 'namaAyah', 'namaIbu', 'kodeMapping']
                .forEach(id => { document.getElementById(id).value = ''; });
        }

        // --- Notifikasi gaya macOS ---
        function escHtml(t) {
            return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function showMacNotif({ title, message, icon = 'fa-exclamation-triangle', colors = ['#ffc861', '#e08a0c'], duration = 7000 }) {
            const stack = document.getElementById('notifStack');
            const el = document.createElement('div');
            el.className = 'notif';
            el.setAttribute('role', 'alert');
            // **teks** -> tebal (setelah di-escape)
            const msgHtml = escHtml(message).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            el.innerHTML = `
                <span class="n-x" title="Tutup">&times;</span>
                <div class="n-ic" style="background:linear-gradient(160deg,${colors[0]},${colors[1]})"><i class="fas ${icon}"></i></div>
                <div class="n-body">
                    <div class="n-top"><span class="n-title">${escHtml(title)}</span><span class="n-time">sekarang</span></div>
                    <div class="n-msg">${msgHtml}</div>
                </div>`;
            stack.appendChild(el);
            requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));

            let timer;
            const close = () => {
                clearTimeout(timer);
                el.classList.remove('show');
                el.classList.add('hide');
                setTimeout(() => el.remove(), 500);
            };
            const arm = () => { timer = setTimeout(close, duration); };
            el.addEventListener('mouseenter', () => clearTimeout(timer));
            el.addEventListener('mouseleave', arm);
            el.addEventListener('click', close);
            arm();
        }

        // Cari mapping yang sudah ada untuk siswa yang sama di SEMUA kelas (NISN, atau nama jika NISN kosong)
        async function findExistingMapping(f) {
            try {
                await refreshMapped();
                return mappedByKey[siswaKey(f.nisn, f.nama_siswa)] || mappedByKode[f.kode_maping] || null;
            } catch (e) {
                return null;
            }
        }

        function notifDuplicate(existing, f) {
            const nama = (existing && existing.nama_siswa) || f.nama_siswa;
            const kelas = (existing && existing.kelas) || f.kelas;
            showMacNotif({
                title: 'Data Siswa Sudah Dimapping',
                message: `Data siswa **${nama}** yang Anda pilih telah di-mapping di kelas **${kelas}**.`
            });
        }

        // --- Edit Kelas (hanya kolom kelas yang bisa diubah) ---
        const editModal = document.getElementById('editKelasModal');
        const editForm = document.getElementById('editKelasForm');
        const editKelasSelect = document.getElementById('editKelasSelect');
        let editingKode = null;

        function closeEditModal() {
            editModal.classList.remove('active');
            editingKode = null;
        }

        async function openEditKelas(kode) {
            const item = mappingIndex[kode];
            if (!item) return;
            editingKode = kode;

            document.getElementById('editKode').value = item.kode_maping || '';
            document.getElementById('editNamaSiswa').value = item.nama_siswa || '';
            document.getElementById('editNisnField').value = item.nisn || '';

            if (rombelCache.length === 0) {
                try {
                    const { data, error } = await simpedikClient
                        .from('rombel')
                        .select('nama_kelas')
                        .order('nama_kelas');
                    if (!error && data) rombelCache = data;
                } catch (err) {
                    console.error('Error loading rombel:', err);
                }
            }

            const names = [...new Set([item.kelas, ...rombelCache.map(r => r.nama_kelas)])].filter(Boolean);
            editKelasSelect.innerHTML = '';
            names.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n;
                opt.textContent = n;
                editKelasSelect.appendChild(opt);
            });
            editKelasSelect.value = item.kelas;

            editModal.classList.add('active');
        }

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-edit');
            if (btn && btn.dataset.kode) openEditKelas(btn.dataset.kode);
        });
        document.getElementById('closeEditKelas').addEventListener('click', closeEditModal);
        document.getElementById('cancelEditKelas').addEventListener('click', closeEditModal);
        window.addEventListener('click', (e) => { if (e.target === editModal) closeEditModal(); });

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const item = mappingIndex[editingKode];
            if (!item) { closeEditModal(); return; }

            const kelasBaru = editKelasSelect.value;
            if (!kelasBaru || kelasBaru === item.kelas) {
                closeEditModal();
                showMacNotif({
                    title: 'Tidak Ada Perubahan',
                    message: `Kelas siswa **${item.nama_siswa}** tidak diubah.`,
                    icon: 'fa-info', colors: ['#6cb8ff', '#2a74d6'], duration: 4000
                });
                return;
            }

            const submitBtn = editForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Menyimpan...';
            submitBtn.disabled = true;

            try {
                const { data, error } = await supabaseClient
                    .from('mappingsiswa')
                    .update({ kelas: kelasBaru })
                    .eq('kode_maping', item.kode_maping)
                    .select('kode_maping');

                if (error) throw error;
                if (!data || data.length === 0) {
                    throw new Error('Tidak ada data yang berubah. Periksa izin UPDATE (policy RLS) tabel mappingsiswa.');
                }

                const nama = item.nama_siswa;
                closeEditModal();
                activeKelas = kelasBaru;      // tampilkan tab kelas tujuan
                await loadKelasTabs();
                showMacNotif({
                    title: 'Kelas Berhasil Diubah',
                    message: `Siswa **${nama}** dipindahkan ke kelas **${kelasBaru}**.`,
                    icon: 'fa-check', colors: ['#59d6a0', '#1b8a5c'], duration: 5000
                });
            } catch (err) {
                console.error('Error updating kelas:', err);
                showMacNotif({
                    title: 'Gagal Mengubah Kelas',
                    message: err.message || 'Terjadi kesalahan saat menyimpan.',
                    icon: 'fa-times', colors: ['#f2706b', '#c92f2c']
                });
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        mappingForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = mappingForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Menyimpan...';
            submitBtn.disabled = true;

            const formData = {
                kode_maping: document.getElementById('kodeMapping').value,
                kelas: document.getElementById('kelasMapping').value,
                nama_siswa: namaSiswaHidden.value,
                nisn: document.getElementById('nisn').value,
                alamat: document.getElementById('alamat').value,
                tempat_lahir: document.getElementById('tempatLahir').value,
                tanggal_lahir: document.getElementById('tanggalLahir').value || null,
                nama_ayah: document.getElementById('namaAyah').value,
                nama_ibu: document.getElementById('namaIbu').value
            };

            try {
                if (!selectedSiswa || !formData.nama_siswa || !formData.kode_maping) {
                    showMacNotif({
                        title: 'Siswa Belum Dipilih',
                        message: 'Pilih **kelas** lalu **siswa** dari daftar terlebih dahulu.',
                        icon: 'fa-info', colors: ['#6cb8ff', '#2a74d6'], duration: 4000
                    });
                    return;
                }

                // Cek data ganda (semua kelas) sebelum menyimpan
                const existing = await findExistingMapping(formData);
                if (existing) {
                    notifDuplicate(existing, formData);
                    return;
                }

                const { error } = await supabaseClient
                    .from('mappingsiswa')
                    .insert([formData]);

                if (error) throw error;

                alert('Data Mapping Berhasil Disimpan!');
                closeModal();
                loadKelasTabs();

            } catch (err) {
                console.error('Error saving mapping:', err);
                if (err && (err.code === '23505' || /duplicate key/i.test(err.message || ''))) {
                    notifDuplicate(await findExistingMapping(formData), formData);
                } else {
                    alert('Gagal menyimpan data: ' + err.message);
                }
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        window.deleteMapping = async function(kode, kelas) {
            if(confirm('Apakah Anda yakin ingin menghapus data ini?')) {
                const { error } = await supabaseClient.from('mappingsiswa').delete().eq('kode_maping', kode);
                if(error) {
                    alert('Gagal menghapus: ' + error.message);
                } else {
                    loadMappingDataForClass(kelas);
                }
            }
        }

        window.exportMappingPdf = async function(kelasName) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4');
            const pageWidth = doc.internal.pageSize.getWidth();
            let yPos = 20;

            if (schoolData.kop_sekolah) {
                try {
                    const response = await fetch(schoolData.kop_sekolah);
                    const blob = await response.blob();
                    const base64data = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(blob);
                    });

                    const imgProps = doc.getImageProperties(base64data);
                    const pdfWidth = pageWidth - 20;
                    const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    
                    doc.addImage(base64data, 'PNG', 10, 10, pdfWidth, imgHeight);
                    yPos = 10 + imgHeight + 10;
                } catch (err) {
                    console.error("Gagal memuat KOP Sekolah:", err);
                }
            }

            try {
                const { data, error } = await supabaseClient
                    .from('mappingsiswa')
                    .select('*')
                    .eq('kelas', kelasName)
                    .order('nama_siswa', { ascending: true });

                if (error) throw error;

                if (!data || data.length === 0) {
                    alert('Tidak ada data untuk diexport.');
                    return;
                }

                doc.setFontSize(18);
                doc.text(`Data Mapping Siswa - Kelas ${kelasName}`, pageWidth / 2, yPos, { align: 'center' });
                yPos += 8;
                
                const schoolName = schoolData.nama_sekolah || document.querySelector('.navbar-brand span')?.textContent || 'SMK Negeri 1 Mentok';
                doc.setFontSize(12);
                doc.setTextColor(100);
                doc.text(schoolName, pageWidth / 2, yPos, { align: 'center' });
                yPos += 10;

                const tableData = data.map((item, index) => [
                    index + 1,
                    item.kode_maping,
                    item.nisn || '-',
                    item.nama_siswa,
                    item.alamat || '-',
                    item.tempat_lahir || '-',
                    item.tanggal_lahir || '-',
                    item.nama_ayah || '-',
                    item.nama_ibu || '-'
                ]);

                doc.autoTable({
                    head: [['No', 'Kode', 'NISN', 'Nama Siswa', 'Alamat', 'Tempat Lahir', 'Tgl Lahir', 'Ayah', 'Ibu']],
                    body: tableData,
                    startY: yPos,
                    theme: 'grid',
                    styles: { fontSize: 9 },
                    headStyles: { fillColor: [102, 126, 234] }
                });

                doc.save(`Mapping_Siswa_${kelasName}.pdf`);

            } catch (err) {
                console.error('Export error:', err);
                alert('Gagal export PDF: ' + err.message);
            }
        }
    </script>
</body>
</html>
